name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Update project versions
        shell: node {0}
        run: |
          const fs = require('fs');
          const version = process.env.VERSION;
          
          if (!version) {
            console.error("VERSION environment variable is not set");
            process.exit(1);
          }

          // 1. 更新 package.json
          try {
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = version;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            console.log('Updated package.json');
          } catch (e) { console.log('package.json not found or invalid'); }
          
          // 2. 更新 Cargo.toml (使用正则匹配 version = "x.x.x")
          try {
            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            cargo = cargo.replace(/^version\s*=\s*".*"/m, `version = "${version}"`);
            fs.writeFileSync('src-tauri/Cargo.toml', cargo);
            console.log('Updated Cargo.toml');
          } catch (e) { console.log('src-tauri/Cargo.toml not found'); }
          
          // 3. 更新 tauri.conf.json
          try {
            let tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            if (tauri.version) tauri.version = version; // Tauri v2 格式
            if (tauri.package) tauri.package.version = version; // Tauri v1 格式
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(tauri, null, 2));
            console.log('Updated tauri.conf.json');
          } catch (e) { console.log('src-tauri/tauri.conf.json not found'); }


      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Redim v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          updaterJsonKeep: true
          updaterJsonGistId: '2349bdae1e9d79747cd32f03db142e7b'
